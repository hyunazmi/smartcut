[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcut"
version = "0.1.0"
description = "Cut videos with the smartcut method"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
smartcut = "smartcut.cli:main"

[tool.setuptools.packages.find]
include = ["smartcut*"]
