[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snipy"
version = "0.2.0"
description = "Cut videos with the smart cut method"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
snipy = "snipy.cli:main"

[tool.setuptools.packages.find]
include = ["snipy*"]
